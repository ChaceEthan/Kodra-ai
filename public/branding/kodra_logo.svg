<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="kodraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Outer Shield / Hex Block -->
    <rect x="5" y="5" width="90" height="90" rx="22" fill="#0f172a" stroke="url(#kodraGrad)" stroke-width="3" />
    
    <!-- Stylized K Circuit Matrix -->
    <path d="M 32 25 L 32 75" stroke="url(#kodraGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 32 50 L 68 25" stroke="url(#kodraGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 45 42 L 68 75" stroke="url(#kodraGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Tech Accent Nodes -->
    <circle cx="68" cy="25" r="4.5" fill="#38bdf8" />
    <circle cx="68" cy="75" r="4.5" fill="#818cf8" />
    <circle cx="32" cy="50" r="4.5" fill="#22d3ee" />
  </g>

  <!-- Typography -->
  <!-- Brand Name -->
  <text x="120" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="2">
    KODRA <tspan fill="url(#kodraGrad)">AI</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="122" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="4">
    CODE • THINK • CREATE
  </text>

  <!-- Core Badge -->
  <rect x="365" y="32" width="125" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="427.5" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#38bdf8" text-anchor="middle">
    PHASE 1 CORE
  </text>
</svg>
